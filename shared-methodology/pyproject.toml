[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-market-data"
version = "0.1.0"
description = "Shared Binance market-data ingestion and event reconstruction."
requires-python = ">=3.11"
dependencies = [
  "polars>=1.20,<2",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
crypto-market-data = "crypto_market_data.cli:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
